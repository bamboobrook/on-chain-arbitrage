name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # TypeScript (packages + apps)
  # ---------------------------------------------------------------------------
  ts:
    name: TS · typecheck & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --filter "./packages/**" --filter "./apps/**" exec tsc --noEmit

  # ---------------------------------------------------------------------------
  # Rust cores
  # ---------------------------------------------------------------------------
  rust:
    name: Rust · build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Solidity contracts
  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts · forge build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: forge fmt check
        working-directory: contracts
        run: forge fmt --check

      - name: forge build
        working-directory: contracts
        run: forge build

      - name: forge test
        working-directory: contracts
        run: forge test -vv
