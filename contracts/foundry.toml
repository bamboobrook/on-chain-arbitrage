[profile.default]
src = "src"
out = "out"
libs = ["lib", "../lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
auto_detect_solc = false
ffi = false
gas_reports = ["*"]
remappings = [
    "@openzeppelin/contracts/=../lib/openzeppelin-contracts/contracts/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[fuzz]
runs = 256

[invariant]
runs = 256

# Mainnet-fork profile (used by test/fork/*). Requires RPC_BASE_URL in env.
[profile.fork]
eth_rpc_url = "RPC_BASE_URL"
