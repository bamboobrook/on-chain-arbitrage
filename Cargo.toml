# On-Chain Arbitrage Lab — Rust workspace root.
# High-performance cores (DEX math, graph search, backtest simulation,
# execution routing) live here; they are bridged to the Node.js apps via
# the `crates/napi` native module and can also run as standalone CLIs.

[workspace]
resolver = "2"
members = [
    "crates/strategy-core",
    "crates/backtest-engine",
    "crates/execution-router",
]

# The napi crate is an optional member: it requires a cdylib build target and
# is built on demand from packages/sdk. Excluded from default workspace builds
# to keep `cargo test` fast.
exclude = ["crates/napi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/bamboobrook/on-chain-arbitrage"
authors = ["On-Chain Arbitrage Lab"]

[workspace.dependencies]
# Error handling
anyhow = "1"
thiserror = "1"

# Async
tokio = { version = "1", features = ["full"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Numeric
ruint = "1"
rust_decimal = { version = "1", features = ["serde"] }

# Ethereum
alloy = { version = "0.3", features = [
    "node-bindings",
    "rpc-types",
    "providers",
    "signers",
    "signer-local",
] }

# EVM simulation
revm = { version = "13", features = ["std", "serde"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Misc
once_cell = "1"
itertools = "0.13"
parking_lot = "0.12"
dashmap = "6"
rayon = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
